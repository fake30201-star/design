<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دخول لوحة التحكم — أتيليه</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="login-wrap">
  <form class="swatch-card login-card" id="loginForm">
    <div style="text-align:center;margin-bottom:16px;">
      <div style="font-family:'Playfair Display',serif;font-size:2rem;font-weight:700;">
        أتيليه
      </div>
      <a href="https://protofile-sepia.vercel.app/" target="_blank" 
         style="text-decoration:none;font-family:'Playfair Display',serif;font-weight:700;font-size:1.1rem;color:var(--wine);">
        M <span style="color:var(--ink);">for</span> MADA
      </a>
      <div class="eyebrow" style="justify-content:center;margin-top:8px;">دخول الأدمن</div>
    </div>
    <h1>لوحة تحكم أتيليه</h1>
    <p>سجّل دخولك عشان تدير المعرض وتصمّم قطع جديدة.</p>
    <div class="field">
      <label for="username">اسم المستخدم</label>
      <input id="username" name="username" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="password">كلمة السر</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <p class="err" id="err">اسم المستخدم أو كلمة السر غلط.</p>
    <button class="btn wine" type="submit">دخول</button>
  </form>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const errEl = document.getElementById('err');
  errEl.style.display = 'none';
  try {
    const res = await fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    if (!res.ok) throw new Error('bad creds');
    const data = await res.json();
    localStorage.setItem('atelier_admin_token', data.token);
    window.location.href = '/admin/dashboard.html';
  } catch {
    errEl.style.display = 'block';
  }
});
</script>
</body>
</html>
